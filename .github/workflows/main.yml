name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o My_Mistake_My_Rule_v1.zip -d project
          cd project
          PROJECT_DIR=$(find . -name pubspec.yaml -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Install dependencies
        run: |
          cd project/$PROJECT_DIR
          flutter pub get

      - name: Build APK
        run: |
          cd project/$PROJECT_DIR
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Mistake-My-Rule-APK
          path: project/${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
